tes} site${a.nSites>1?'s':''}</h3><details ${a.nPosts>1?'open':''}><summary>Show all copies</summary>${a.copies.map(c=>`<div class="copy"><a href="${safe(c.url)}" target="_blank" rel="noopener">${esc(c.site)}</a> ${esc(c.published)} · ${fmt(c.words)}w${c.traffic!=null?' · '+fmt(c.traffic)+' visits/mo':''}</div>`).join('')}</details><h3>Full text</h3><p class="note">The article text is not included in this shared version. Use "Open original" or the copies above to read it on the source site.</p>`}
const S=A.flatMap(a=>a.stats.map(c=>({c,a})));function stats(){const q=$('sq').value.trim().toLowerCase(),t=$('sTopic').value,r=$('sRank').value,X=S.filter(x=>(!t||x.a.topic===t)&&(!r||x.a.rank)&&(!q||(x.c+' '+x.a.title).toLowerCase().includes(q))).sort((x,y)=>(x.a.rank??1e6)-(y.a.rank??1e6));$('scount').textContent=`${fmt(X.length)} statistics`;$('sbody').innerHTML=X.slice(0,slim).map(x=>`<tr><td>${esc(x.c)}</td><td><a href="${safe(x.a.url)}" target="_blank" rel="noopener">${esc(x.a.title)}</a></td><td>${esc(lab(x.a.topic))}</td><td class="n">${x.a.rank?'#'+x.a.rank:'–'}</td></tr>`).join('');$('smore').hidden=X.length<=slim}
const DC=[['site','Domain'],['dr','DR'],['traffic','Site traffic / mo'],['recent','Recent posts'],['older','Older posts'],['sample','Sample articles'],['avgScore','Avg score']];function sites(){$('dhead').innerHTML=DC.map(([k,l])=>`<th class="${k==='site'?'':'n'}"><button data-k="${k}">${l}${ds.k===k?(ds.d<0?' ▼':' ▲'):''}</button></th>`).join('');const q=$('dq').value.toLowerCase(),X=D.sites.filter(s=>s.site.includes(q)).sort((a,b)=>ds.k==='site'?ds.d*a.site.localeCompare(b.site):ds.d*((a[ds.k]??-1)-(b[ds.k]??-1)));$('dcount').textContent=`${X.length} sites shown`;$('dbody').innerHTML=X.map(s=>`<tr><td><a href="https://${esc(s.site)}/" target="_blank" rel="noopener">${esc(s.site)}</a></td><td class="n">${s.dr}</td><td class="n">${fmt(s.traffic)}</td><td class="n">${fmt(s.recent)}</td><td class="n">${fmt(s.older)}</td><td class="n">${fmt(s.sample)}</td><td class="n">${s.avgScore==null?'–':s.avgScore.toFixed(2)}</td></tr>`).join('')}
function tab(v){document.querySelectorAll('.view').forEach(e=>e.hidden=e.id!==v);document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))}document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)tab(b.dataset.v)};$('list').onclick=e=>{if(e.target.id==='more'){lim+=100;list();return}const r=e.target.closest('.row');if(r)show(+r.dataset.id)};$('detail').onclick=e=>{if(e.target.id==='back')$('articles').classList.remove('reading')};['q','fType','fTopic','fSyn','sort','minS','minW','fTraffic'].forEach(i=>$(i).addEventListener('input',filter));['sq','sTopic','sRank'].forEach(i=>$(i).addEventListener('input',()=>{slim=120;stats()}));$('smore').onclick=()=>{slim+=120;stats()};$('dq').oninput=sites;$('dhead').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;ds=ds.k===k?{k,d:-ds.d}:{k,d:k==='site'?1:-1};sites()};
tab('articles');filter();stats();sites();const m=/^#article-(\d+)$/.exec(location.hash);if(m)show(+m[1],false);else if(F[0]){show(F[0].id,false);$('articles').classList.remove('reading')}})();
</script>
